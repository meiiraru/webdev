<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trabalho de casa 2</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

<div class="container">

  <div class="images-container">
    <div id="top-row">
      <img class="size-2" src="./img/1.png" alt="Image 1">
      <img class="size-2" src="./img/2.png" alt="Image 2">
      <img class="size-2" src="./img/3.png" alt="Image 3">
      <img class="size-2" src="./img/4.png" alt="Image 4">
      <img class="size-2" src="./img/5.png" alt="Image 5">
    </div>

    <div id="bottom-row">
      <img class="size-2" src="./img/6.png" alt="Image 6">
      <img class="size-2" src="./img/7.png" alt="Image 7">
      <img class="size-2" src="./img/8.png" alt="Image 8">
      <img class="size-2" src="./img/9.png" alt="Image 9">
      <img class="size-2" src="./img/10.png" alt="Image 10">
    </div>
  </div>

  <div class="buttons">
    <button id="decrease-btn">-</button>
    <button id="increase-btn">+</button>
  </div>

</div>

</body>
<script src="./js/scripts.js"></script>
</html>
