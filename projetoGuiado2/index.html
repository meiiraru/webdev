<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projeto Guiado #2</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

<div class="container">
  <div class="header">
    <h2>Cadastre seu veículo na nossa loja!</h2>
  </div>

  <div class="form-container">
    <div class="form-header"><p>Formulário</p></div>

    <div class="form-body">
      <h1>Venda seu veículo conosco!</h1>
      <p>Descreva as características e escolha os opcionais que seu veículo possui</p>

      <form>
        <div class="box-input">
          <label for="title">Título do anúncio <span class="required-field">*</span></label>
          <input class="block" type="text" id="title" name="title" minlength="1" maxlength="30" placeholder="Adicione o título do anúncio:" required>
        </div>

        <div class="box-input">
          <label for="price">Preço do anúncio <span class="required-field">*</span></label>
          <input class="block" type="number" id="price" name="price" min="0" placeholder="Adicione o preço do carro:" required>
        </div>

        <div class="box-input">
          <label for="description">Descrição <span class="required-field">*</span></label>
          <textarea class="block" id="description" name="description" placeholder="Coloque os detalhes do seu veículo" required></textarea>
        </div>

        <div class="box-input">
          <label for="brand">Marca do veículo</label>
          <input class="block" type="text" id="brand" name="brand" placeholder="Adicione a marca do veículo:">
        </div>

        <div class="box-input">
          <label for="model">Modelo do veículo <span class="required-field">*</span></label>
          <input class="block" type="text" id="model" name="model" placeholder="Adicione o modelo do veículo:" required>
        </div>

        <div class="box-input">
          <label for="mileage">Kilometragem do veículo <span class="required-field">*</span></label>
          <input class="block" type="number" id="mileage" name="mileage" min="0" placeholder="Kilometragem:" required>
        </div>

        <div class="box-input">
          <label for="purchase-date">Data da compra do veículo <span class="required-field">*</span></label>
          <input class="block" type="date" id="purchase-date" name="purchase-date" required>
        </div>

        <div class="box-input">
          <p>Tipo de câmbio: <span class="required-field">*</span></p>

          <input type="radio" id="manual" name="gear">
          <label for="manual">Manual</label>

          <input type="radio" id="auto" name="gear">
          <label for="auto">Automático</label>
        </div>

        <div class="options-box">
          <p>Opcionais</p>

          <ul class="options-list">
            <li>
              <input type="checkbox" name="options[]" value="airbag" id="airbag">
              <label for="airbag">Airbag</label>
            </li>
            <li>
              <input type="checkbox" name="options[]" value="alarm" id="alarm">
              <label for="alarm">Alarme</label>
            </li>
            <li>
              <input type="checkbox" name="options[]" value="ac" id="ac">
              <label for="ac">Ar Condicionado</label>
            </li>
            <li>
              <input type="checkbox" name="options[]" value="cam" id="cam">
              <label for="cam">Câmera de Ré</label>
            </li>
          </ul>
        </div>

        <div class="options-box">
          <ul class="options-list">
            <li>
              <input type="checkbox" name="options[]" value="assistant" id="assistant">
              <label for="assistant">Assistente de Pista</label>
            </li>
            <li>
              <input type="checkbox" name="options[]" value="keyless" id="keyless">
              <label for="keyless">Partida Keyless</label>
            </li>
            <li>
              <input type="checkbox" name="options[]" value="cellphone" id="cellphone">
              <label for="cellphone">Integração com o Celular</label>
            </li>
            <li>
              <input type="checkbox" name="options[]" value="leather" id="leather">
              <label for="leather">Bancos de Couro</label>
            </li>
          </ul>
        </div>

        <div class="box-input">
          <p>Fotos do carro <span class="required-field">*</span></p>
          <input type="file" id="pictures" name="pictures" multiple accept="image/*" required>
        </div>

        <input type="submit" value="Enviar" class="btn-submit">
      </form>
    </div>
  </div>
</div>

</body>
</html>
